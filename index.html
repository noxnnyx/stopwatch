<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orrery Stopwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400&family=IBM+Plex+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #ece6d6;
    --ivory-dim: rgba(236, 230, 214, 0.55);
    --muted: #7f7b72;
    --hair: rgba(236, 230, 214, 0.12);
    --brass: #c8a46a;
    --sage: #9fc7a8;
    --rose: #d98c8c;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ivory);
    font-family: var(--sans);
    font-weight: 300;
    background:
      radial-gradient(ellipse 70% 50% at 50% 30%, #11131f 0%, #07080d 55%, #020203 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 85% 75% at 50% 38%, transparent 55%, rgba(0,0,0,0.65) 100%);
  }

  .brand {
    position: fixed; top: 20px; left: 24px; z-index: 3;
    font-family: var(--mono); font-size: 11px; letter-spacing: .32em;
    color: var(--ivory-dim);
  }
  .brand b { font-weight: 400; color: var(--ivory); }
  .brand span { display: block; margin-top: 6px; letter-spacing: .18em; color: var(--muted); font-family: var(--sans); }

  main { position: relative; z-index: 2; }
  .stage { height: 64vh; min-height: 360px; }
  .console { max-width: 520px; margin: 0 auto; padding: 0 16px 56px; }

  /* 시간 표시 */
  .display {
    text-align: center;
    font-family: var(--mono);
    font-weight: 200;
    font-size: clamp(52px, 15vw, 92px);
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px rgba(236, 210, 160, 0.18);
  }
  .display .frac { font-size: .46em; color: var(--muted); letter-spacing: 0; margin-left: .08em; }

  /* 세 개의 주기 */
  .readouts {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
    margin: 26px 0 30px;
  }
  .ro-head {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted); letter-spacing: .08em;
  }
  .ro-head em { font-style: normal; font-family: var(--mono); }
  .ro-val { font-family: var(--mono); font-size: 14px; margin: 6px 0 8px; font-variant-numeric: tabular-nums; }
  .ro-val small { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .bar { height: 1px; background: var(--hair); position: relative; }
  .bar i { position: absolute; left: 0; top: -0.5px; height: 2px; background: var(--brass); width: 0; box-shadow: 0 0 6px rgba(200,164,106,.6); }

  /* 버튼 */
  .controls { display: flex; justify-content: center; gap: 14px; margin-bottom: 30px; }
  .btn {
    min-width: 132px; height: 46px; padding: 0 22px;
    border-radius: 999px;
    border: 1px solid rgba(236, 230, 214, 0.22);
    background: rgba(255, 255, 255, 0.025);
    color: var(--ivory);
    font-family: var(--sans); font-size: 14px; letter-spacing: .3em; text-indent: .3em;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: border-color .25s, background .25s, color .25s, opacity .25s;
  }
  .btn:hover:not(:disabled) { border-color: rgba(236, 230, 214, 0.5); background: rgba(255,255,255,.05); }
  .btn:disabled { opacity: .3; cursor: default; }
  .btn.primary { border-color: rgba(200, 164, 106, 0.7); color: #e6cf9e; }
  .btn.primary:hover { background: rgba(200, 164, 106, 0.08); }
  .btn.primary.running { border-color: rgba(217, 140, 140, 0.6); color: #e9b3ab; }
  .btn.primary.running:hover { background: rgba(217, 140, 140, 0.07); }

  /* 랩 */
  .laps { border-top: 1px solid var(--hair); }
  .laps[hidden] { display: none; }
  .row {
    display: grid; grid-template-columns: 4rem 1fr 1fr;
    padding: 11px 4px;
    border-bottom: 1px solid var(--hair);
    font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums;
  }
  .row span:not(:first-child) { text-align: right; }
  .row.head { font-family: var(--sans); font-size: 11px; color: var(--muted); letter-spacing: .1em; padding: 9px 4px; }
  .row.current { color: var(--ivory-dim); }
  .row .n { color: var(--muted); }
  .row.best span:nth-child(2) { color: var(--sage); }
  .row.worst span:nth-child(2) { color: var(--rose); }
  .row.new { animation: rise .6s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(-4px); } }
  ol { list-style: none; margin: 0; padding: 0; }

  .hint { text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .08em; margin-top: 26px; }
  .hint kbd { font-family: var(--mono); border: 1px solid var(--hair); border-radius: 4px; padding: 1px 6px; margin: 0 3px; }

  @media (max-width: 480px) {
    .readouts { gap: 12px; }
    .ro-head { flex-direction: column; gap: 3px; }
    .btn { min-width: 0; flex: 1; }
    .brand { left: 16px; top: 16px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>

<header class="brand"><b>ORRERY</b> · STOPWATCH<span>THE ORBITS OF TIME</span></header>

<main>
  <section class="stage" id="stage" aria-hidden="true"></section>

  <section class="console">
    <div class="display"><span id="mainTime">00:00</span><span class="frac" id="fracTime">.00</span></div>

    <div class="readouts">
      <div class="ro">
        <div class="ro-head"><span>Mercury</span><em>1 s</em></div>
        <div class="ro-val"><span id="rv0">0.00</span><small>rev</small></div>
        <div class="bar"><i id="rb0"></i></div>
      </div>
      <div class="ro">
        <div class="ro-head"><span>Earth</span><em>1 min</em></div>
        <div class="ro-val"><span id="rv1">0.000</span><small>rev</small></div>
        <div class="bar"><i id="rb1"></i></div>
      </div>
      <div class="ro">
        <div class="ro-head"><span>Saturn</span><em>1 h</em></div>
        <div class="ro-val"><span id="rv2">0.0000</span><small>rev</small></div>
        <div class="bar"><i id="rb2"></i></div>
      </div>
    </div>

    <div class="controls">
      <button id="lapBtn" class="btn" disabled>LAP</button>
      <button id="startBtn" class="btn primary">START</button>
    </div>

    <div class="laps" id="lapsWrap" hidden>
      <div class="row head"><span>#</span><span>Split</span><span>Total</span></div>
      <ol id="laps"></ol>
    </div>

    <p class="hint"><kbd>Space</kbd>Start/Stop <kbd>L</kbd>Lap <kbd>R</kbd>Reset · Move the mouse to shift the view</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ================= 스탑워치 로직 =================
  const $ = id => document.getElementById(id);
  const startBtn = $('startBtn'), lapBtn = $('lapBtn');
  const lapList = $('laps'), lapsWrap = $('lapsWrap');

  // 수성 1초, 지구 1분, 토성 1시간에 한 바퀴
  const PERIODS = [1000, 60000, 3600000];
  const DIGITS = [2, 3, 4];

  let running = false;
  let startTime = 0;   // performance.now() at last start
  let elapsed = 0;     // ms accumulated before last start
  let laps = [];       // { split, total }
  let lastLapTotal = 0;
  let orrery = null;

  const pad = n => String(n).padStart(2, '0');
  function format(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    return (h ? h + ':' : '') + pad(m) + ':' + pad(s) + '.' + pad(cs);
  }

  function now() {
    return running ? elapsed + performance.now() - startTime : elapsed;
  }

  function updateUI(t) {
    const f = format(t);
    $('mainTime').textContent = f.slice(0, -3);
    $('fracTime').textContent = f.slice(-3);
    PERIODS.forEach((p, i) => {
      $('rv' + i).textContent = (t / p).toFixed(DIGITS[i]);
      $('rb' + i).style.width = ((t % p) / p * 100) + '%';
    });
    const cur = lapList.querySelector('.current');
    if (cur) {
      cur.children[1].textContent = format(t - lastLapTotal);
      cur.children[2].textContent = f;
    }
  }

  function row(cls, n, split, total) {
    const li = document.createElement('li');
    li.className = 'row ' + cls;
    li.innerHTML = `<span class="n">${pad(n)}</span><span>${split}</span><span>${total}</span>`;
    return li;
  }

  function renderLaps() {
    lapList.innerHTML = '';
    lapsWrap.hidden = false;
    const t = now();
    lapList.appendChild(row('current', laps.length + 1, format(t - lastLapTotal), format(t)));

    let min = -1, max = -1;
    if (laps.length >= 2) {
      const splits = laps.map(l => l.split);
      min = splits.indexOf(Math.min(...splits));
      max = splits.indexOf(Math.max(...splits));
    }
    for (let i = laps.length - 1; i >= 0; i--) {
      const cls = [i === min && 'best', i === max && 'worst', i === laps.length - 1 && 'new'].filter(Boolean).join(' ');
      lapList.appendChild(row(cls, i + 1, format(laps[i].split), format(laps[i].total)));
    }
  }

  function toggle() {
    if (running) {
      elapsed += performance.now() - startTime;
      running = false;
      startBtn.textContent = 'START';
      startBtn.classList.remove('running');
      lapBtn.textContent = 'RESET';
    } else {
      startTime = performance.now();
      running = true;
      startBtn.textContent = 'STOP';
      startBtn.classList.add('running');
      lapBtn.textContent = 'LAP';
      lapBtn.disabled = false;
      if (!lapList.children.length) renderLaps();
    }
  }

  function lapOrReset() {
    if (running) {
      const total = now();
      laps.push({ split: total - lastLapTotal, total });
      lastLapTotal = total;
      if (orrery) orrery.addLap(total);
      renderLaps();
    } else {
      reset();
    }
  }

  function reset() {
    running = false;
    elapsed = 0;
    laps = [];
    lastLapTotal = 0;
    lapList.innerHTML = '';
    lapsWrap.hidden = true;
    if (orrery) orrery.clearLaps();
    startBtn.textContent = 'START';
    startBtn.classList.remove('running');
    lapBtn.textContent = 'LAP';
    lapBtn.disabled = true;
  }

  // 버튼에 포커스가 남으면 Space가 두 번 눌린 것처럼 동작하므로 바로 해제
  startBtn.addEventListener('click', () => { toggle(); startBtn.blur(); });
  lapBtn.addEventListener('click', () => { lapOrReset(); lapBtn.blur(); });
  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') { if (running) lapOrReset(); }
    else if (e.key === 'r' || e.key === 'R') { if (!running) reset(); }
  });

  function loop() {
    const t = now();
    updateUI(t);
    if (orrery) orrery.update(t);
    requestAnimationFrame(loop);
  }

  // ================= 3D 오러리 =================
  // 절차적 텍스처용 3D value noise
  function hash(x, y, z) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1274126177)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function noise3(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    const l = (a, b, t) => a + (b - a) * t;
    return l(
      l(l(hash(xi, yi, zi), hash(xi + 1, yi, zi), u), l(hash(xi, yi + 1, zi), hash(xi + 1, yi + 1, zi), u), v),
      l(l(hash(xi, yi, zi + 1), hash(xi + 1, yi, zi + 1), u), l(hash(xi, yi + 1, zi + 1), hash(xi + 1, yi + 1, zi + 1), u), v),
      w);
  }
  function fbm(x, y, z, oct) {
    let sum = 0, amp = 0.5, norm = 0, f = 1;
    for (let i = 0; i < oct; i++) {
      sum += noise3(x * f, y * f, z * f) * amp;
      norm += amp; amp *= 0.5; f *= 2.03;
    }
    return sum / norm;
  }
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  function initOrrery() {
    const canvas = $('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 600);

    const R = { merc: 2.2, earth: 3.8, sat: 5.8, dial: 7.0 };
    const IVORY = 0xece6d6, BRASS = 0xc8a46a;

    function canvasTex(w, h, draw, srgb = true) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      draw(c.getContext('2d'), w, h);
      const t = new THREE.CanvasTexture(c);
      if (srgb) t.encoding = THREE.sRGBEncoding;
      t.anisotropy = 4;
      return t;
    }
    function sphereTex(w, h, fn) {
      return canvasTex(w, h, ctx => {
        const img = ctx.createImageData(w, h), d = img.data;
        for (let y = 0; y < h; y++) {
          const lat = (0.5 - (y + 0.5) / h) * Math.PI;
          const cl = Math.cos(lat), sl = Math.sin(lat);
          for (let x = 0; x < w; x++) {
            const lon = (x + 0.5) / w * Math.PI * 2;
            const c = fn(cl * Math.cos(lon), sl, cl * Math.sin(lon));
            const i = (y * w + x) * 4;
            d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = c.length > 3 ? c[3] : 255;
          }
        }
        ctx.putImageData(img, 0, 0);
      });
    }
    const glowTex = canvasTex(256, 256, (ctx, w) => {
      const g = ctx.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      g.addColorStop(0, 'rgba(255,244,220,1)');
      g.addColorStop(0.12, 'rgba(255,200,130,0.55)');
      g.addColorStop(0.35, 'rgba(255,130,60,0.14)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, w);
    });
    const dotTex = canvasTex(64, 64, (ctx, w) => {
      const g = ctx.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.3, 'rgba(255,255,255,0.5)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, w);
    });

    // ---------- 조명: 태양 하나 + 아주 약한 환경광 → 깊은 명암 ----------
    scene.add(new THREE.AmbientLight(0x3a4466, 0.12));
    const sunLight = new THREE.PointLight(0xfff0d8, 2.1, 0, 1);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(1024, 1024);
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 24;
    sunLight.shadow.bias = -0.003;
    scene.add(sunLight);

    // ---------- 태양 ----------
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(0.85, 64, 64),
      new THREE.MeshBasicMaterial({
        map: sphereTex(512, 256, (x, y, z) => {
          const n = fbm(x * 14, y * 14, z * 14, 4) * 0.7 + fbm(x * 3, y * 3, z * 3, 3) * 0.3;
          return mix([255, 150, 62], [255, 246, 222], smooth(0.25, 0.75, n));
        })
      }));
    scene.add(sun);
    const glowA = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    glowA.scale.set(3.4, 3.4, 1);
    const glowB = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.45 }));
    glowB.scale.set(11, 11, 1);
    scene.add(glowA, glowB);

    // ---------- 궤도면 ----------
    const disc = new THREE.Mesh(
      new THREE.CircleGeometry(R.dial, 128),
      new THREE.MeshBasicMaterial({
        map: canvasTex(512, 512, (ctx, w) => {
          const g = ctx.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
          g.addColorStop(0, 'rgba(255,190,120,0.35)');
          g.addColorStop(0.35, 'rgba(120,110,140,0.10)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, w, w);
        }),
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
      }));
    disc.rotation.x = -Math.PI / 2;
    scene.add(disc);

    function circle(r, opacity, color = IVORY) {
      const pts = [];
      for (let i = 0; i < 256; i++) { const a = i / 256 * Math.PI * 2; pts.push(new THREE.Vector3(Math.sin(a) * r, 0, -Math.cos(a) * r)); }
      return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
    }
    function ticks(r, count, lenFn, opacity) {
      const p = [];
      for (let i = 0; i < count; i++) {
        const a = i / count * Math.PI * 2, s = Math.sin(a), c = -Math.cos(a), L = lenFn(i);
        p.push(s * r, 0, c * r, s * (r + L), 0, c * (r + L));
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
      return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: IVORY, transparent: true, opacity }));
    }
    // 수성 궤도: 1/100초 눈금, 지구 궤도 바깥: 초 눈금, 토성 궤도: 분 눈금
    scene.add(circle(R.merc, 0.18), ticks(R.merc + 0.1, 100, i => i % 10 === 0 ? 0.16 : 0.05, 0.28));
    scene.add(circle(R.earth, 0.18));
    scene.add(circle(R.sat, 0.16), ticks(R.sat + 0.1, 60, i => i % 5 === 0 ? 0.2 : 0.07, 0.3));
    scene.add(ticks(R.dial, 240, i => i % 20 === 0 ? 0.34 : i % 4 === 0 ? 0.16 : 0.06, 0.4));

    const brass = new THREE.MeshStandardMaterial({ color: BRASS, metalness: 0.65, roughness: 0.38 });
    const bezel = new THREE.Mesh(new THREE.TorusGeometry(R.dial, 0.014, 8, 360), brass);
    bezel.rotation.x = Math.PI / 2;
    const bezel2 = new THREE.Mesh(new THREE.TorusGeometry(R.dial + 1.25, 0.01, 8, 360), brass);
    bezel2.rotation.x = Math.PI / 2;
    scene.add(bezel, bezel2);

    // 다이얼 숫자
    for (let i = 0; i < 60; i += 5) {
      const tex = canvasTex(128, 64, (ctx, w, h) => {
        ctx.fillStyle = 'rgba(236,230,214,0.85)';
        ctx.font = '300 40px "IBM Plex Mono", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(pad(i), w / 2, h / 2);
      });
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.55, depthWrite: false }));
      const a = i / 60 * Math.PI * 2, r = R.dial + 0.72;
      s.position.set(Math.sin(a) * r, 0, -Math.cos(a) * r);
      s.scale.set(0.62, 0.31, 1);
      scene.add(s);
    }

    // ---------- 행성 ----------
    function trail(r, arcDeg, color) {
      const n = 96, pos = [], col = [], c = new THREE.Color(color);
      for (let i = 0; i <= n; i++) {
        const a = -i / n * arcDeg * Math.PI / 180, k = Math.pow(1 - i / n, 2.2);
        pos.push(Math.sin(a) * r, 0, -Math.cos(a) * r);
        col.push(c.r * k, c.g * k, c.b * k);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      return new THREE.Line(g, new THREE.LineBasicMaterial({ vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    }
    function orbitPivot(r, arcDeg, trailColor) {
      const pivot = new THREE.Group();
      pivot.add(trail(r, arcDeg, trailColor));
      const holder = new THREE.Group();
      holder.position.set(0, 0, -r);
      pivot.add(holder);
      scene.add(pivot);
      return { pivot, holder };
    }
    function planet(radius, map, extra = {}) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(radius, 64, 48),
        new THREE.MeshStandardMaterial(Object.assign({ map, roughness: 0.9, metalness: 0 }, extra)));
      m.castShadow = m.receiveShadow = true;
      return m;
    }
    function atmosphere(radius, color, power) {
      return new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 32), new THREE.ShaderMaterial({
        uniforms: { color: { value: new THREE.Color(color) } },
        vertexShader: `varying vec3 vN; varying vec3 vV;
          void main(){ vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position,1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `uniform vec3 color; varying vec3 vN; varying vec3 vV;
          void main(){ float f = pow(1.0 - max(dot(vN, vV), 0.0), ${power.toFixed(1)}); gl_FragColor = vec4(color * f, f); }`,
        blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
      }));
    }

    // 수성
    const merc = orbitPivot(R.merc, 210, 0xb8b0d8);
    const mercury = planet(0.18,sphereTex(256, 128, (x, y, z) => {
      let c = 70 + 120 * fbm(x * 3 + 7, y * 3, z * 3, 5);
      if (noise3(x * 9, y * 9, z * 9) > 0.74) c *= 0.7;
      return [c, c * 0.96, c * 0.92];
    }));
    merc.holder.add(mercury);

    // 지구 + 달
    const earthOrbit = orbitPivot(R.earth, 70, 0x6aa8ff);
    const earthTilt = new THREE.Group();
    earthTilt.rotation.z = 0.41;
    earthOrbit.holder.add(earthTilt);
    const earth = planet(0.32, sphereTex(512, 256, (x, y, z) => {
      const n = fbm(x * 1.8 + 5, y * 1.8, z * 1.8, 5);
      const m = fbm(x * 5, y * 5, z * 5, 3);
      if (Math.abs(y) > 0.86 - n * 0.12) return [232, 238, 244];
      if (n > 0.53) return mix(mix([58, 92, 48], [150, 126, 82], m), [105, 98, 80], smooth(0.53, 0.68, n) * 0.6);
      return mix([6, 22, 58], [24, 70, 118], smooth(0.3, 0.53, n));
    }), { roughness: 0.75 });
    const clouds = new THREE.Mesh(new THREE.SphereGeometry(0.328, 64, 48), new THREE.MeshStandardMaterial({
      map: sphereTex(512, 256, (x, y, z) => [255, 255, 255, smooth(0.5, 0.72, fbm(x * 3 + 11, y * 5, z * 3, 5)) * 230]),
      transparent: true, depthWrite: false, roughness: 1
    }));
    clouds.castShadow = true;
    earthTilt.add(earth, clouds, atmosphere(0.36, 0x5fa0ff, 3.0));
    const moonPivot = new THREE.Group();
    earthOrbit.holder.add(moonPivot);
    moonPivot.add(circle(0.62, 0.12));
    const moon = planet(0.085, sphereTex(256, 128, (x, y, z) => {
      let c = 120 + 90 * fbm(x * 4 + 3, y * 4, z * 4, 5);
      if (noise3(x * 6 + 9, y * 6, z * 6) > 0.7) c *= 0.75;
      return [c, c, c * 0.97];
    }));
    moon.position.set(0, 0, -0.62);
    moonPivot.add(moon);

    // 토성 + 고리
    const satOrbit = orbitPivot(R.sat, 32, 0xe2c48a);
    const satTilt = new THREE.Group();
    satTilt.rotation.set(0.25, 0, 0.47);
    satOrbit.holder.add(satTilt);
    const saturn = planet(0.5, sphereTex(512, 256, (x, y, z) => {
      const w = fbm(x * 2, y * 2, z * 2, 3);
      const b = 0.5 + 0.5 * Math.sin(y * 38 + w * 4), b2 = 0.5 + 0.5 * Math.sin(y * 11 + 1);
      return mix(mix([228, 206, 158], [172, 132, 80], b * 0.55 + b2 * 0.45), [140, 128, 110], smooth(0.75, 0.98, Math.abs(y)));
    }));
    const RIN = 0.68, ROUT = 1.22;
    const ringGeo = new THREE.RingGeometry(RIN, ROUT, 160, 1);
    {
      const pos = ringGeo.attributes.position, uv = ringGeo.attributes.uv, v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i); uv.setXY(i, (v.length() - RIN) / (ROUT - RIN), 0.5); }
    }
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({
      map: canvasTex(512, 4, (ctx, w, h) => {
        const img = ctx.createImageData(w, h);
        for (let x = 0; x < w; x++) {
          const r = x / (w - 1);
          let a = 0.55 + 0.22 * Math.sin(r * 60) + 0.15 * Math.sin(r * 170 + 1) + 0.1 * (noise3(r * 80, 0, 0) - 0.5);
          a *= smooth(0, 0.08, r) * (1 - smooth(0.9, 1, r));
          if (r > 0.57 && r < 0.63) a *= 0.06;   // 카시니 간극
          a = Math.min(1, Math.max(0, a));
          const c = mix([196, 174, 132], [242, 230, 204], 0.5 + 0.5 * Math.sin(r * 23));
          for (let y = 0; y < h; y++) {
            const i = (y * w + x) * 4;
            img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = a * 235;
          }
        }
        ctx.putImageData(img, 0, 0);
      }),
      transparent: true, alphaTest: 0.05, side: THREE.DoubleSide, roughness: 0.85
    }));
    ring.rotation.x = -Math.PI / 2;
    ring.castShadow = ring.receiveShadow = true;
    satTilt.add(saturn, ring);

    // ---------- 아밀러리 고리: 서로 다른 속도로 도는 기울어진 황동 고리 ----------
    const gimbalA = new THREE.Group(), gimbalB = new THREE.Group();
    const ringA = new THREE.Mesh(new THREE.TorusGeometry(8.9, 0.016, 8, 400), brass);
    ringA.rotation.x = Math.PI / 2 + 0.41;
    const beadA = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), brass);
    beadA.position.set(8.9, 0, 0);
    ringA.add(beadA);
    gimbalA.add(ringA);
    const tiltB = new THREE.Group();
    tiltB.rotation.z = -0.3;
    const ringB = new THREE.Mesh(new THREE.TorusGeometry(9.3, 0.011, 8, 400),
      new THREE.MeshStandardMaterial({ color: IVORY, metalness: 0.4, roughness: 0.5, transparent: true, opacity: 0.55 }));
    ringB.rotation.x = Math.PI / 2;
    const beadB = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), brass);
    beadB.position.set(-9.3, 0, 0);
    ringB.add(beadB);
    tiltB.add(ringB);
    gimbalB.add(tiltB);
    scene.add(gimbalA, gimbalB);

    // ---------- 별 ----------
    function starLayer(count, size, opacity) {
      const p = [], c = [];
      for (let i = 0; i < count; i++) {
        const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, r = 90 + Math.random() * 90;
        const s = Math.sqrt(1 - u * u);
        p.push(s * Math.cos(th) * r, u * r, s * Math.sin(th) * r);
        const warm = Math.random();
        const col = new THREE.Color().setHSL(warm < 0.5 ? 0.6 : 0.1, 0.25, 0.6 + Math.random() * 0.4);
        c.push(col.r, col.g, col.b);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
      return new THREE.Points(g, new THREE.PointsMaterial({
        size, map: dotTex, vertexColors: true, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending
      }));
    }
    const sky = new THREE.Group();
    sky.add(starLayer(2200, 0.7, 0.7), starLayer(160, 1.6, 0.9));
    scene.add(sky);

    // ---------- 랩 표식: 지구 궤도 위에 남는 빛기둥 ----------
    const lapGroup = new THREE.Group();
    scene.add(lapGroup);
    function addLap(t) {
      const a = (t % PERIODS[1]) / PERIODS[1] * Math.PI * 2;
      const x = Math.sin(a) * R.earth, z = -Math.cos(a) * R.earth;
      const g = new THREE.Group();
      const dot = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color: 0xf2dcae, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
      dot.scale.set(0.32, 0.32, 1);
      const pillar = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0.9, 0)]),
        new THREE.LineBasicMaterial({ color: BRASS, transparent: true, opacity: 0.6 }));
      g.add(dot, pillar);
      g.position.set(x, 0, z);
      lapGroup.add(g);
    }
    function clearLaps() {
      while (lapGroup.children.length) lapGroup.remove(lapGroup.children[0]);
    }

    // ---------- 카메라 ----------
    const view = { az: 0, el: 0.5, taz: 0, tel: 0.5, dist: 40 };
    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const stageFrac = Math.min(0.9, $('stage').offsetHeight / h);
      const tanHalf = Math.tan(15 * Math.PI / 180);
      const dW = 9.8 / (tanHalf * camera.aspect) + 3;
      const dH = 7.2 / (tanHalf * stageFrac);
      view.dist = Math.max(dW, dH);
      // 시스템 중심을 화면의 "stage" 영역 가운데로 올린다
      camera.setViewOffset(w, h, 0, h * (0.5 - stageFrac / 2), w, h);
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    addEventListener('pointermove', e => {
      view.taz = (e.clientX / innerWidth - 0.5) * 0.5;
      view.tel = 0.5 + (e.clientY / innerHeight - 0.5) * 0.25;
    });
    resize();

    const TAU = Math.PI * 2;
    let last = performance.now();
    function update(t) {
      const n = performance.now(), dt = Math.min(0.05, (n - last) / 1000);
      last = n;

      merc.pivot.rotation.y = -(t % PERIODS[0]) / PERIODS[0] * TAU;
      earthOrbit.pivot.rotation.y = -(t % PERIODS[1]) / PERIODS[1] * TAU;
      satOrbit.pivot.rotation.y = -(t % PERIODS[2]) / PERIODS[2] * TAU;
      moonPivot.rotation.y = -(t % 5000) / 5000 * TAU;
      earth.rotation.y = t / 2500;
      clouds.rotation.y = t / 2100;
      saturn.rotation.y = t / 1800;
      mercury.rotation.y = t / 4000;
      gimbalA.rotation.y = -(t % 600000) / 600000 * TAU;
      gimbalB.rotation.y = (t % 1800000) / 1800000 * TAU;

      // 시간과 무관한 배경의 미세한 움직임
      sun.rotation.y += dt * 0.05;
      sky.rotation.y += dt * 0.004;
      const pulse = running ? 1 + Math.sin(n / 700) * 0.04 : 0.92;
      glowA.scale.setScalar(3.4 * pulse);
      glowB.material.opacity += ((running ? 0.5 : 0.35) - glowB.material.opacity) * 0.05;

      view.az += (view.taz - view.az) * 0.04;
      view.el += (view.tel - view.el) * 0.04;
      camera.position.set(
        view.dist * Math.cos(view.el) * Math.sin(view.az),
        view.dist * Math.sin(view.el),
        view.dist * Math.cos(view.el) * Math.cos(view.az));
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    return { update, addLap, clearLaps };
  }

  function start3D() {
    try { if (window.THREE) orrery = initOrrery(); }
    catch (err) { console.error(err); }
  }
  // 다이얼 숫자를 웹폰트로 그리기 위해 폰트 로딩을 잠깐 기다린다
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))])
    .then(start3D);
  loop();
</script>
